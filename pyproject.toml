[tool.poetry]
name = "gait-analysis-tfg"
version = "0.1.0"
description = "Extraccion y procesado espectral de señales de marcha desde InfluxDB"
authors = ["Clarissa <c.otanez@alumnos.upm.es>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
influxdb-client = "^1.48.0"
PyYAML = "^6.0.2"
python-dotenv = "^1.2.2"
numpy = ">=1.26,<2"
pandas = "^2.2.3"
scipy = "^1.14.0"
pyarrow = "^17.0.0"
tables = "^3.11.1"
openpyxl = "^3.1.5"
sphinx = "<9"
matplotlib = "^3.10.8"
scikit-learn = "^1.8.0"
xgboost = "^3.2.0"
catboost = "^1.2.10"
torch = "2.2.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
